# Parametry misji SUAS — te same wartosci co w suas_simple_mission.launch.py.
#
# Po co osobny plik: misja musi isc przez `ros2 run`, a nie z launcha,
# bo wait_confirm czyta klawiature i potrzebuje stdin podpietego do
# terminala. Wezel odpalony z launcha go nie ma.
#
# Uzycie:
#   ros2 run drone_autonomy suas_simple_mission --ros-args \
#       --params-file ~/ros_ws/src/drone_bringup/config/suas_mission.yaml \
#       -p drop_after_hover:=true
#
# '/**' = dotyczy wezla o dowolnej nazwie, wiec ten sam plik obsluzy
# tez suas_full_mission.
/**:
  ros__parameters:
    settle_time: 3.0
    hover_hold_time: 5.0
    center_tol_m: 1.5
    search_timeout: 300.0   # 4 galsy x 250 m = 1000 m, przy 5 m/s 200 s; 120 ucinalo grid na 60%
    finish_action: "rtl"
    test_sweep: false
    drop_after_hover: false
    target_alt: 50.0
    vfov_deg: 64.4
    img_w: 1024
    img_h: 1024
    damping: 0.6
    kp_vx: 4.0
    kp_hover: 0.2
    kp_alt: 0.5
    kp_yaw: 0.3
    max_vel: 3.0
    max_vz: 1.5
    max_yaw_rate: 0.5
    ema_alpha: 0.15
    lost_timeout: 3.0
    hover_deadzone_m: 0.5
    gimbal_deadzone: 0.06
    det_confirm_frames: 4
    det_window_frames: 8
    # Przerwa miedzy KLATKAMI detektora, po ktorej okno M z N jest zerowane.
    # Detektor publikuje kazda klatke (takze pusta), wiec to mierzy jitter
    # detektora, a nie utrate celu. W symulacji chodzi ~5 Hz z jitterem do
    # 0.7 s, wiec 0.5 zerowalo okno w kolko i cel 31x9 px nigdy sie nie
    # potwierdzal — dron stal nad czlowiekiem i go "nie widzial".
    # Na realu przy 7-14 FPS wystarczy 1.0.
    det_confirm_gap: 1.5
    require_same_track: true
    pitch_search: -55.0
    pitch_min: -90.0
    pitch_max: -30.0
    pitch_hover_thr: -83.0

    # ─── ZRZUT ŁADUNKU ────────────────────────────────────────────────
    # JEDEN serwomechanizm na dwa ladunki (u nas AUX5 = kanal 13): wychyla sie
    # w dwie strony wzgledem pozycji neutralnej. Wychyl w jedna strone zwalnia
    # namiot, w druga czlowieka, pozycja neutralna trzyma oba.
    #
    # drop_servo_ch = 0 -> TRYB SYMULACJI: zrzut tylko sie loguje, nic nie
    # jedzie na sprzet (bezpiecznik — mozesz przelatywac cala misje bez ryzyka
    # zgubienia ladunku). PRZED LOTEM W POLU wpisz numer kanalu serwa: 13.
    #
    # drop_pwm_by_class: PWM zrzutu per klasa [0=namiot, 1=czlowiek].
    # drop_pwm_neutral: pozycja spoczynkowa (trzyma oba ladunki).
    # Wartosci zmierzone 2026-09-05 na realu (kanal 13, SERVO13=RCIN11):
    #   988 = czlowiek, 1327 = neutral, 1602 = namiot.
    drop_servo_ch: 0                 # 0 = symulacja; na realu 13
    drop_pwm_by_class: [1580, 1060]   # [namiot, czlowiek]
    drop_pwm_neutral: 1300
    drop_hold_s: 2.0

    # ─── BRAMKI CZASOWE ───────────────────────────────────────────────
    acquire_timeout: 5.0        # ile czekamy, az detektor potwierdzi cel
    confirm_timeout: 15.0       # ile czekamy na spacje operatora
    approach_timeout: 90.0      # gorny limit calego centrowania
    center_lost_timeout: 15.0   # ciagly SEARCH tak dlugo = cel zniknal na dobre

    # ─── OBSZAR PRZESZUKIWANIA (grid, gdy klasa nie ma kandydatow) ────
    # Prostokat wysrodkowany na pozycji PRZEJECIA LOTU, nie na srodku pola.
    # PRZED LOTEM: wpisz realny obszar po obejrzeniu terenu — 150x250 to
    # liczby z planu zawodow, nie z pomiaru.
    search_w: 150.0
    search_h: 250.0
    search_overlap: 0.3

    # ─── WLASNE PUNKTY PRZESZUKIWANIA ─────────────────────────────────
    # Plaska lista [E1,N1, E2,N2, ...] w METRACH wzgledem punktu, w ktorym
    # misja przejela lot (przelaczenie AUTO -> GUIDED). Dron leci po nich
    # PO KOLEI i po kazdym dolocie sprawdza, czy detektor widzi cel.
    #
    # Ponizsze szesc punktow to trzy galsy odlegle o 30 m: dron poleci
    # najpierw 20 m na zachod i 40 m na polnoc, potem 60 m na poludnie,
    # przeskoczy 30 m na wschod, wroci na polnoc — i tak dalej.
    #
    # Zamiast tej listy mozna podac plik: search_waypoints wskazuje na
    # .waypoints zapisany z Mission Plannera i ma pierwszenstwo nad ta lista.
    # Na realu to jest wlasciwa droga, bo punkty sa wtedy BEZWZGLEDNE — a te
    # ponizej licza sie od miejsca przejecia lotu, czyli od konca trasy ortofoto.
    #
    # Oba puste ([0.0] i "") = dron liczy siatke sam z search_w/search_h.
    search_offsets: [-20.0,  40.0,
                     -20.0, -20.0,
                      10.0, -20.0,
                      10.0,  40.0,
                      40.0,  40.0,
                      40.0, -20.0]
    search_waypoints: ""
