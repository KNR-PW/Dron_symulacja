# Parametry misji SUAS — te same wartosci co w suas_simple_mission.launch.py.
#
# Po co osobny plik: misja musi isc przez `ros2 run`, a nie z launcha,
# bo wait_confirm czyta klawiature i potrzebuje stdin podpietego do
# terminala. Wezel odpalony z launcha go nie ma.
#
# Uzycie:
#   ros2 run drone_autonomy suas_simple_mission --ros-args \
#       --params-file ~/ros_ws/src/drone_bringup/config/suas_mission.yaml \
#       -p drop_after_hover:=true
#
# '/**' = dotyczy wezla o dowolnej nazwie, wiec ten sam plik obsluzy
# tez suas_full_mission.
/**:
  ros__parameters:
    settle_time: 3.0
    hover_hold_time: 5.0
    center_tol_m: 1.5
    search_timeout: 600.0   # trasa z suas_search.waypoints ma 1132 m; 300 s starczylo tylko przy 4 m/s
    finish_action: "rtl"
    test_sweep: false
    # Spirala wokol waypointu, gdy detektor nie potwierdzi celu po dolocie.
    # WYLACZONA: kosztuje 45 s na kazdym niepotwierdzonym kandydacie, a nic
    # nie wnosi przy waypoincie, ktory i tak jest celny co do metra.
    spiral_enabled: false
    drop_after_hover: false
    target_alt: 50.0
    vfov_deg: 64.4
    img_w: 1024
    img_h: 1024
    damping: 0.6
    kp_vx: 4.0
    kp_hover: 0.2
    kp_alt: 0.5
    kp_yaw: 0.3
    max_vel: 3.0
    max_vz: 1.5
    max_yaw_rate: 0.5
    ema_alpha: 0.15
    lost_timeout: 3.0
    hover_deadzone_m: 0.5
    gimbal_deadzone: 0.06
    det_confirm_frames: 4
    det_window_frames: 8
    # Przerwa miedzy KLATKAMI detektora, po ktorej okno M z N jest zerowane.
    # Detektor publikuje kazda klatke (takze pusta), wiec to mierzy jitter
    # detektora, a nie utrate celu. W symulacji chodzi ~5 Hz z jitterem do
    # 0.7 s, wiec 0.5 zerowalo okno w kolko i cel 31x9 px nigdy sie nie
    # potwierdzal — dron stal nad czlowiekiem i go "nie widzial".
    # Na realu przy 7-14 FPS wystarczy 1.0.
    det_confirm_gap: 1.5
    require_same_track: true
    pitch_search: -55.0
    pitch_min: -90.0
    pitch_max: -30.0
    pitch_hover_thr: -83.0

    # ─── ZRZUT ŁADUNKU ────────────────────────────────────────────────
    # JEDEN serwomechanizm na dwa ladunki (u nas AUX5 = kanal 13): wychyla sie
    # w dwie strony wzgledem pozycji neutralnej. Wychyl w jedna strone zwalnia
    # namiot, w druga czlowieka, pozycja neutralna trzyma oba.
    #
    # drop_servo_ch = 0 -> TRYB SYMULACJI: zrzut tylko sie loguje, nic nie
    # jedzie na sprzet (bezpiecznik — mozesz przelatywac cala misje bez ryzyka
    # zgubienia ladunku). PRZED LOTEM W POLU wpisz numer kanalu serwa: 13.
    #
    # drop_pwm_by_class: PWM zrzutu per klasa [0=namiot, 1=czlowiek].
    # drop_pwm_neutral: pozycja spoczynkowa (trzyma oba ladunki).
    # Wartosci zmierzone 2026-09-05 na realu (kanal 13, SERVO13=RCIN11):
    #   988 = czlowiek, 1327 = neutral, 1602 = namiot.
    drop_servo_ch: 0                 # 0 = symulacja; na realu 13
    drop_pwm_by_class: [1580, 1060]   # [namiot, czlowiek]
    drop_pwm_neutral: 1300
    drop_hold_s: 2.0

    # ─── BRAMKI CZASOWE ───────────────────────────────────────────────
    acquire_timeout: 5.0        # ile czekamy, az detektor potwierdzi cel
    # To samo, ale po dolocie do PUNKTU GRIDU. Bylo 1.0 s i bywalo
    # nieprzechodzalne: wait_acquire zeruje okno M z N (4 z 8 klatek), a przy
    # detektorze ~5 Hz z jitterem w sekundzie miescily sie czasem 2 klatki.
    grid_acquire_timeout: 3.0

    # Cel zauwazony W LOCIE, miedzy punktami gridu, zatrzymuje drona tam, gdzie
    # jest — nie czeka z tym do najblizszego waypointu. Po zatrzymaniu cel jest
    # sprawdzany jeszcze raz na stojaco; jesli sie nie potwierdzi, przez
    # det_interrupt_cooldown nie sluchamy detektora, zeby ta sama falszywka nie
    # zatrzymywala drona w kolko.
    grid_det_interrupt: true
    det_interrupt_cooldown: 10.0
    brake_settle_time: 3.0
    confirm_timeout: 15.0       # ile czekamy na spacje operatora
    approach_timeout: 90.0      # gorny limit calego centrowania
    center_lost_timeout: 15.0   # ciagly SEARCH tak dlugo = cel zniknal na dobre

    # ─── OBSZAR PRZESZUKIWANIA (grid, gdy klasa nie ma kandydatow) ────
    # Prostokat wysrodkowany na pozycji PRZEJECIA LOTU, nie na srodku pola.
    # PRZED LOTEM: wpisz realny obszar po obejrzeniu terenu — 150x250 to
    # liczby z planu zawodow, nie z pomiaru.
    search_w: 150.0
    search_h: 250.0
    search_overlap: 0.3

    # ─── WLASNE PUNKTY PRZESZUKIWANIA ─────────────────────────────────
    # Plaska lista [E1,N1, E2,N2, ...] w METRACH wzgledem punktu, w ktorym
    # misja przejela lot (przelaczenie AUTO -> GUIDED). Dron leci po nich
    # PO KOLEI i po kazdym dolocie sprawdza, czy detektor widzi cel.
    #
    # Ponizsze szesc punktow to trzy galsy odlegle o 30 m: dron poleci
    # najpierw 20 m na zachod i 40 m na polnoc, potem 60 m na poludnie,
    # przeskoczy 30 m na wschod, wroci na polnoc — i tak dalej.
    #
    # Zamiast tej listy mozna podac plik: search_waypoints wskazuje na
    # .waypoints zapisany z Mission Plannera i ma pierwszenstwo nad ta lista.
    # Na realu to jest wlasciwa droga, bo punkty sa wtedy BEZWZGLEDNE — a te
    # ponizej licza sie od miejsca przejecia lotu, czyli od konca trasy ortofoto.
    #
    # Oba puste ([0.0] i "") = dron liczy siatke sam z search_w/search_h.
    search_offsets: [-20.0,  40.0,
                     -20.0, -20.0,
                      10.0, -20.0,
                      10.0,  40.0,
                      40.0,  40.0,
                      40.0, -20.0]
    search_waypoints: "~/Dron_symulacja/src/drone_bringup/config/suas_search.waypoints"

    # Co ile sekund w trakcie przeszukiwania dron zaglada do targets.json.
    # Geolokator liczy cele NIEPRZERWANIE, takze gdy lecimy gridem, wiec nowy
    # cel moze sie pojawic w dowolnym momencie: z automatu (klaster przekroczyl
    # min_obs) albo z klikniecia operatora w GUI. Gdy sie pojawi, dron przerywa
    # galsy i leci nad niego normalna sciezka — dolot, akwizycja, potwierdzenie,
    # centrowanie, zrzut — dokladnie tak, jakby mial ten waypoint od poczatku.
    # Klikniecie operatora ma pierwszenstwo nad kandydatem z automatu.
    watch_interval: 2.0

    # Kto moze przerwac grid:
    #   "operator" - tylko reczne oznaczenie w GUI (domyslnie, bezpiecznie)
    #   "any"      - takze kandydat z automatu po przekroczeniu min_obs
    #   "off"      - nikt, grid leci do konca
    # Automat bywa zrodlem falszywek: obiekt systematycznie brany za czlowieka
    # zbuduje rownie zbiezny klaster co prawdziwy cel. Gdy operator patrzy,
    # kosztuje to tylko jeden przelot (spacja bramkuje zrzut); gdy operatora
    # NIE MA, misja nie pyta i falszywka kosztuje ladunek. Dlatego "operator".
    # Ustaw "any", jesli lecisz bez GUI i ufasz progowi min_obs_person.
    watch_sources: "operator"

    # Czy po PELNYM, nieudanym przelocie gridu siegac po najlepszego kandydata
    # z automatu (najwyzszy score, czyli obs * conf).
    #
    # W trakcie gridu automat jest ignorowany, bo klaster ma wtedy kilkanascie
    # obserwacji z jednego mignicia i drzewo wyglada jak czlowiek. Po calym
    # przelocie klastry sa zbudowane z wielu galsow, wiec score faktycznie
    # rozroznia cel od przypadku — i jest to jedyna informacja, jaka zostala,
    # skoro grid nic nie zobaczyl.
    #
    # Jesli dron doleci, detektor nic nie potwierdzi i operator nie da spacji,
    # kandydat jest ODRZUCANY (nie ma zrzutu) i wypada z puli na stale, a dron
    # wraca do gridu. Bez operatora zrzut idzie na wspolrzedne — to ta sama
    # regula co wszedzie: milczenie znaczy "decyduj sam".
    auto_after_grid: true

